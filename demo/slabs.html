<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handwired Brain Transformer: slabs</title>
<style>
  :root { --bg:#f6f6f4; --panel:#ffffff; --ink:#1c1c1a; --muted:#6b6b66; --line:#d9d9d3; --accent:#2a6fdb; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14151a; --panel:#1d1f26; --ink:#e8e8e4; --muted:#9a9a94; --line:#33353f; --accent:#6aa3ff; } }
  :root[data-theme="dark"] { --bg:#14151a; --panel:#1d1f26; --ink:#e8e8e4; --muted:#9a9a94; --line:#33353f; --accent:#6aa3ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { margin:0; font-size:16px; font-weight:600; } header p { margin:2px 0 0; color:var(--muted); font-size:12.5px; }
  a { color:var(--accent); }
  .bar { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:end; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  .bar label { display:block; font-size:12px; color:var(--muted); margin-bottom:2px; }
  select, input[type=range], button { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:4px 6px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  #status { padding:6px 16px; color:var(--muted); font-size:12.5px; }
  #scroll { overflow:auto; padding:0 16px 24px; }
  table { border-collapse:separate; border-spacing:6px; }
  th { font-weight:500; font-size:11.5px; color:var(--muted); white-space:nowrap; }
  th.row { position:sticky; left:0; background:var(--bg); text-align:right; padding-right:6px; z-index:1; }
  td { vertical-align:top; width:132px; }
  .cell { width:132px; cursor:pointer; }
  .cell canvas { display:block; width:132px; height:132px; background:#000; border:1px solid var(--line); border-radius:4px; }
  .cell small { display:block; font:10.5px/1.25 ui-monospace, monospace; color:var(--muted); min-height:27px; margin-top:2px; }
  .cell:hover canvas { border-color:var(--accent); }
  .legend span { display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 4px 0 10px; vertical-align:-1px; }
</style>
</head>
<body>
<header>
  <h1>Handwired Brain Transformer: slab survey</h1>
  <p><a href="index.html">Viewer</a> &middot; One column per slab, one row per stain (DANDI 000108, subject MITU01). Each cell streams a window of that slab at the chosen pyramid level and runs the program the zoom calls for, on WebGPU. Click a cell to open it in the viewer.</p>
</header>
<div class="bar">
  <div><label for="level">Zoom (pyramid level)</label><select id="level"></select></div>
  <div><label for="model">Model</label><select id="model"></select></div>
  <div><label for="chunk">Chunk of each slab</label><select id="chunk"><option value="mid">middle</option><option value="first">first</option><option value="last">last</option></select></div>
  <div><label for="opacity">Overlay opacity</label><input id="opacity" type="range" min="0" max="100" value="70"></div>
  <div><label for="bri">Brightness <span id="brival">0.00</span></label><input id="bri" type="range" min="-0.5" max="0.5" step="0.01" value="0"></div>
  <div><label for="con">Contrast <span id="conval">1.00</span></label><input id="con" type="range" min="0.2" max="4" step="0.05" value="1"></div>
  <div><label for="gam">Gamma <span id="gamval">1.00</span></label><input id="gam" type="range" min="0.2" max="3" step="0.05" value="1"></div>
  <div><label><input type="checkbox" id="autoexp" checked> auto exposure (model)</label><button id="adjreset">Reset</button></div>
  <div><button id="csv">Download stats (CSV)</button></div>
  <div class="legend note" id="legend"></div>
</div>
<div id="status"></div>
<div id="scroll"><table id="grid"></table></div>
<script type="module" src="slabs.js"></script>
</body>
</html>
